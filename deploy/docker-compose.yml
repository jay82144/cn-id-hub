version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: identity-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - identity-hub-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed to host - only accessible within Docker network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: identity-hub-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      MAGIC_LINK_EXPIRATION_MINUTES: ${MAGIC_LINK_EXPIRATION_MINUTES:-15}
      CORS_ORIGINS: ${CORS_ORIGINS}
      BACKEND_URL: ${BACKEND_URL}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - identity-hub-internal
      - identity-hub-external
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${BACKEND_URL}
    container_name: identity-hub-frontend
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    networks:
      - identity-hub-external
    expose:
      - "80"
    depends_on:
      - backend

networks:
  identity-hub-internal:
    driver: bridge
    internal: true  # No external access
  identity-hub-external:
    driver: bridge

volumes:
  postgres_data:
    name: identity-hub-postgres-data
