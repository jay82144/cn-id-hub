version: '3.8'

services:
  # ============================================================
  # SHARED POSTGRESQL DATABASE
  # ============================================================
  shared-postgres:
    image: postgres:16-alpine
    container_name: shared-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Database is NOT exposed publicly - only accessible via app-network

  # ============================================================
  # IDENTITY HUB BACKEND (FastAPI)
  # ============================================================
  id-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: id-backend
    restart: unless-stopped
    environment:
      # Database Configuration
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      
      # JWT & Auth Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      MAGIC_LINK_EXPIRATION_MINUTES: ${MAGIC_LINK_EXPIRATION_MINUTES:-15}
      
      # URL Configuration
      BACKEND_URL: ${ID_APP_BASE_URL}
      
      # CORS Configuration
      CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS}
      
      # Cookie Security
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      
      # O365 / Microsoft SSO (optional)
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      
      # Bootstrap Admin
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin.new@local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-ChangeMeNow!}
    depends_on:
      shared-postgres:
        condition: service_healthy
    networks:
      - app-network
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================
  # IDENTITY HUB FRONTEND (React + Nginx)
  # ============================================================
  id-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${ID_APP_BASE_URL}
    container_name: id-frontend
    restart: unless-stopped
    networks:
      - app-network
    expose:
      - "80"
    depends_on:
      id-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ============================================================
# NETWORKS
# ============================================================
networks:
  app-network:
    external: true
    name: app-network

# ============================================================
# VOLUMES
# ============================================================
volumes:
  postgres_data:
    name: id-app-postgres-data
