version: '3.8'

services:
  # PostgreSQL Database
  shared-postgres:
    image: postgres:15-alpine
    container_name: shared-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: id_app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: id_app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U id_app_user -d id_app"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed to host - only accessible within Docker network

  # FastAPI Backend
  id-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: id-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://id_app_user:${POSTGRES_PASSWORD}@shared-postgres:5432/id_app
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      MAGIC_LINK_EXPIRATION_MINUTES: ${MAGIC_LINK_EXPIRATION_MINUTES:-15}
      CORS_ORIGINS: ${CORS_ORIGINS}
      BACKEND_URL: ${BACKEND_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
    depends_on:
      shared-postgres:
        condition: service_healthy
    networks:
      - app-network-internal
      - app-network
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  id-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${BACKEND_URL}
    container_name: id-frontend
    restart: unless-stopped
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    networks:
      - app-network
    expose:
      - "80"
    depends_on:
      - id-backend

networks:
  app-network-internal:
    name: app-network-internal
    driver: bridge
    internal: true  # No external access - database network
  app-network:
    name: app-network
    driver: bridge
    # External access allowed - frontend/backend network

volumes:
  postgres_data:
    name: id-app-postgres-data
